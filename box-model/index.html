<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box - Model Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="content">
    
    <!-- Visual Box Container Area -->
    <div id="boxes">
      <!-- Wrapper containers host the orange visual margin background -->
      <div class="box-wrapper">
        <div id="box-1">
          <p>BOX - 1</p>
        </div>
      </div>

      <div class="box-wrapper">
        <div id="box-2">
          <p>BOX - 2</p>
        </div>
      </div>
    </div>

    <!-- Sliders Adjustment Panel -->
    <div id="edits">
      <!-- Controls for Box 1 -->
      <div id="box-1-edit" class="control-group">
        <h3>Box 1 Properties</h3>
        <label for="margin-1">Margin for box 1</label>
        <input type="range" id="margin-1" value="10" min="0" max="40">
        <br>

        <label for="border-1">Border for box 1</label>
        <input type="range" id="border-1" value="2" min="0" max="20">
        <br>

        <label for="padding-1">Padding for box 1</label>
        <input type="range" id="padding-1" value="5" min="0" max="40">
      </div>

      <!-- Controls for Box 2 -->
      <div id="box-2-edit" class="control-group">
        <h3>Box 2 Properties</h3>
        <label for="margin-2">Margin for box 2</label>
        <input type="range" id="margin-2" value="10" min="0" max="40">
        <br>

        <label for="border-2">Border for box 2</label>
        <input type="range" id="border-2" value="2" min="0" max="20">
        <br>

        <label for="padding-2">Padding for box 2</label>
        <!-- Typo fixed from padding21 to padding-2 -->
        <input type="range" id="padding-2" value="5" min="0" max="40">
      </div>
    </div>
    
  </div>

  <script src="script.js"></script>
</body>

</html>
